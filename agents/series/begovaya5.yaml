# Бриф серии «Дом с историей» — Беговая, 5.
# Источник: Google Doc «ФИНАЛ — Беговая, 5: серия «Дом с историей» (тексты + ТЗ монтажёру)».
# Коды А (архив) и G (генерация) совпадают с ТЗ, так монтажёр сразу находит нужный кадр.
#
# Поля кадра:
#   find:      что искать. wiki — Wikimedia Commons (только свободные лицензии),
#              pastvu — архив по адресу (place) или по номеру фото (cid), и годам (years)
#   generate:  промт картинки для FLUX (3 варианта, 9:16)
#   motion:    как оживить в Kling. Нет поля — кадр статичный, наезд делает монтажёр
#   manual:    задача для ассистента руками (агент её только показывает в статусе)
#   fallback:  чем заменить, если не нашли

# Папка серии на диске: «ГГГГ-ММ-ДД тема» по правилам маркетинговой системы (дата первого выпуска)
series: "2026-11-02 Дом с историей Беговая 5"
renamed_from: "Беговая5_Дом_с_историей"   # старое имя — при переезде папка переименуется
content_id: "2026-11-02-dom-s-istoriey-begovaya-5"   # карточка в broker-nata-marketing/content/
nickname: "@natalia_kopacheva"
total: 5          # выпусков в серии — для «N/5» на финальной карточке

defaults:
  variants: 3          # сколько вариантов генерировать на каждый G-кадр
  candidates: 8        # сколько архивных кандидатов на каждый A-кадр
  voice_speed: 1.1     # озвучка ускоряется (тембр сохраняется), кадры и титры — под новый темп
  negative: >-
    узнаваемые лица, крупные портреты, современные машины, современная одежда, яркие цвета,
    деформация зданий, лишние конечности, текст, водяные знаки, резкие движения камеры

# Свои материалы Натальи: папки на Яндекс.Диске по ссылке. use: путь к файлу внутри папки.
# Сами ссылки — только в agents/.env (репозиторий публичный): ./run.sh keys assets
assets:
  yadisk: "env:YADISK_BEGOVAYA"     # Беговая 5: фото объекта и свои видео
  personal: "env:YADISK_PERSONAL"   # личное: фотосессия Вадима Титова 24.10.2024

places:
  hippodrome: "Беговая улица, 22, Москва"   # Московский ипподром
  begovaya5: "Беговая улица, 5, Москва"
  cheryomushki: "Новые Черёмушки, Москва"

episodes:
  1:
    title: "Кони, которые пережили пожар"
    # Покадровое ТЗ из сценария: по нему ./run.sh begovaya montage собирает ролик.
    # shots — коды кадров по приоритету (С — съёмка, А — архив, G — генерация): берётся первый готовый.
    # screen — надпись на экране, ◆ перед словом — акцент золотом. color: warm | sepia.
    timeline:
      - {t: "0.0-4.0", shots: [С1, A3], color: warm, screen: "КОНИ ПЕРЕЖИЛИ ◆ПОЖАР",
         voice: "Эти кони пережили пожар, который уничтожил всё здание под ними.",
         need: "С1 кони на крыше ипподрома снизу вверх"}
      - {t: "4.0-6.0", shots: [С2], color: warm, screen: "ПОЧЕМУ ◆БЕГОВАЯ?",
         voice: "Почему улица называется Беговой?", need: "С2 табличка «Беговая ул.»"}
      - {t: "6.0-9.0", shots: [С3, G1], color: sepia, voice: "Лошади здесь не скачут — они бегут рысью.",
         need: "С3 рысак в качалке, рапид"}
      - {t: "9.0-15.0", shots: [A1, G1], color: sepia, screen: "◆1834 · ХОДЫНКА",
         voice: "Первого августа тысяча восемьсот тридцать четвёртого года на Ходынском поле прошёл первый рысистый бег."}
      - {t: "15.0-19.0", shots: [ДОП2, G1], color: sepia, screen: "ЧЕЙ РЫСАК ◆БЫСТРЕЕ",
         voice: "Николаевская Москва едет за город — смотреть, чей рысак быстрее."}
      - {t: "19.0-21.0", shots: [G2], color: sepia, voice: "И вот тут начинаются большие деньги."}
      - {t: "21.0-26.0", shots: [ДОП1, A2, G4], color: sepia, screen: "◆1 000 000 РУБЛЕЙ",
         voice: "В конце века здесь поднимают каменные трибуны с башенками. Больше миллиона рублей."}
      - {t: "26.0-33.0", color: sepia, slide: {title: "≈ 9 МЛРД ₽", text: "≈ 100 КВАРТИР"},
         voice: "Запомните эту цифру. Сегодня это семь с половиной — девять миллиардов. Около ста пятикомнатных квартир на этой улице.",
         need: "типографика: анимированный счётчик (монтажёр)"}
      - {t: "33.0-36.0", shots: [A3, С1], color: sepia, screen: "КОНИ ◆КЛОДТА",
         voice: "Наверх ставят коней работы Клодта и Волнухина."}
      - {t: "36.0-40.0", shots: [A4, G3], color: sepia, screen: "◆1910 · УТОЧКИН",
         voice: "Над трибунами запускают воздушные шары, а в мае девятьсот десятого…"}
      - {t: "40.0-43.0", shots: [G3], color: sepia, voice: "…круги над ипподромом пишет аэроплан Уточкина."}
      - {t: "43.0-48.0", shots: [G4], color: sepia, screen: "◆1949",
         voice: "А потом — сорок девятый год. Пожар. Трибуны сгорают."}
      - {t: "48.0-50.0", shots: [A3, С1], color: sepia, screen: "КОНИ ◆УЦЕЛЕЛИ", voice: "А кони — уцелели."}
      - {t: "50.0-54.0", shots: [A5, С4], color: sepia, screen: "ЖОЛТОВСКИЙ · ◆1955",
         voice: "Жолтовский строит новое здание, и кони снова встают наверх."}
      - {t: "54.0-55.0", shots: [С4, A5], color: warm, voice: "А сейчас?", need: "С4 пролёт к фасаду ипподрома сегодня"}
      - {t: "55.0-62.0", shots: [С4, A6, A5], color: warm, screen: "◆11,35 МЛРД ₽",
         voice: "Семнадцатого сентября этого года ипподром открылся после реконструкции. В неё вложили больше одиннадцати миллиардов."}
      - {t: "62.0-65.0", shots: [A2, С4], color: sepia, screen: "БОЛЬШЕ, ЧЕМ ◆ЦАРСКИЕ",
         voice: "Даже больше, чем стоили царские трибуны в сегодняшних деньгах.",
         need: "split-screen А2 (сепия) | С4 (цвет) — монтажёр"}
      - {t: "65.0-69.0", shots: [С5], color: warm, screen: "◆200 ЛЕТ",
         voice: "Почти двести лет Москва вкладывает в это место. И каждый раз — по-крупному.",
         need: "С5 Наталья идёт по Беговой аллее"}
      - {t: "69.0-72.5", shots: [С5], color: warm, screen: "ДАЛЬШЕ — ◆ДОМ →",
         voice: "Это первый выпуск «Дома с историей». Подпишитесь: дальше — дом на этой улице, который достраивали, когда украшать дома уже запретили.",
         need: "С5 Наталья в камеру"}
      - {t: "72.5-74.0", final: "Дальше — ◆дом на Беговой"}
    shots:
      A1:
        what: "Бега на Ходынском поле, XIX век (гравюра, литография)"
        timecode: "9–15"
        find:
          - {wiki: "Khodynka racing 19th century Moscow"}
          - {wiki: "Moscow Hippodrome 19th century"}
          - {pastvu: hippodrome, years: "1830-1900"}
        manual: "goskatalog.ru: «бега Ходынское поле»"
        fallback: G1
      A2:
        what: "Каменные трибуны с башенками (до пожара 1949)"
        timecode: "21–26, 62–65"
        find:
          - {wiki: "Moscow Hippodrome grandstand 1900"}
          - {wiki: "Москва Бега открытка"}
          - {pastvu: hippodrome, years: "1890-1949"}
        fallback: "открытка / G4 без огня"
      A3:
        what: "Кони на старом здании, скульптура крупно"
        timecode: "33–36, 48–50"
        find:
          - {wiki: "Moscow Hippodrome horses sculpture Klodt"}
          - {pastvu: hippodrome, years: "1900-1960"}
        fallback: "С1 в сепии"
      A4:
        what: "Сергей Уточкин с аэропланом «Фарман», 1910"
        timecode: "36–40"
        find:
          - {wiki: "Sergei Utochkin Farman"}
          - {wiki: "Utochkin aeroplane 1910"}
        motion: >-
          Оживи архивную фотографию: пропеллер аэроплана начинает вращаться, лёгкий ветер,
          едва заметный наезд камеры. Сохрани чёрно-белую плёночную фактуру, лица не меняй.
        fallback: G3
      A5:
        what: "Здание Жолтовского в 1950-е"
        timecode: "50–54"
        find:
          - {pastvu: hippodrome, years: "1951-1960"}
          - {wiki: "Moscow Hippodrome Zholtovsky"}
        fallback: "С4 в сепии"
      A6:
        what: "Скриншот заголовка СМИ об открытии ипподрома 17.09.2026"
        timecode: "55–62"
        manual: "m24.ru / iz.ru / rg.ru — скриншот заголовка с датой"
      # Съёмки не будет: С-кадры собираем из современных фото (Wikimedia) и генерации, оживляем в Kling
      С1:
        what: "Кони на крыше ипподрома сегодня, снизу вверх"
        timecode: "0–4, 48–50"
        find:
          - {wiki: "Moscow Hippodrome horses sculpture roof"}
          - {wiki: "Central Moscow Hippodrome"}
        generate: >-
          Bronze sculptures of rearing horses on the roof of the Central Moscow Hippodrome, monumental
          neoclassical Stalinist building, low angle looking up, clear morning sky, warm sunlight,
          present day, photorealistic, no people, vertical 9:16
        motion: "Медленный подъём камеры снизу вверх к скульптурам коней на крыше, утреннее солнце, лёгкие облака"
        negative: "люди, лица, текст, водяные знаки, деформация скульптур и здания, резкие движения камеры"
      С2:
        what: "Табличка «Беговая ул.» на доме"
        timecode: "4–6"
        generate: >-
          Close-up of a classic blue Moscow street name sign with white letters "БЕГОВАЯ УЛ." mounted on a
          beige stucco wall of a Stalinist building, soft morning light, present day, photorealistic, vertical 9:16
        motion: "Едва заметный наезд камеры на табличку, по стене скользит солнечный блик"
        negative: "люди, лица, искажённые буквы, лишний текст, водяные знаки, резкие движения камеры"
        fallback: "слайд «БЕГОВАЯ УЛ.» (если буквы на генерации кривые)"
      С3:
        what: "Рысак в качалке на дорожке ипподрома"
        timecode: "6–9"
        find:
          - {wiki: "harness racing Moscow hippodrome"}
          - {wiki: "trotting race Moscow"}
        generate: >-
          A trotter horse pulling a light racing sulky with a driver seen from behind, racing on a sand track
          of the Moscow hippodrome, grandstand in the background, motion, golden hour, present day,
          cinematic, vertical 9:16
        motion: "Рысак бежит рысью по дорожке, эффект замедленной съёмки, камера плавно ведёт за ним"
        negative: "узнаваемые лица, текст, водяные знаки, лишние ноги у лошади, деформация, резкие движения камеры"
      С4:
        what: "Главное здание ипподрома сегодня: фасад, трибуны"
        timecode: "54–62"
        find:
          - {wiki: "Central Moscow Hippodrome building"}
          - {wiki: "Moscow Hippodrome facade Begovaya"}
        motion: "Плавный пролёт камеры вдоль фасада, солнечный день, лёгкое движение облаков"
        negative: "люди крупным планом, текст, водяные знаки, деформация здания, резкие движения камеры"
      С5:
        what: "Наталья — финал серии (вместо съёмки на аллее)"
        timecode: "65–72,5"
        use: "personal:/Фотосессии личное для обложки/Наталья Копачева - Вадим Титов 2024-10-24/8W8A5644.jpg"   # фотосессия, плавный наезд
      G1:
        what: "1834, бега на открытом поле"
        timecode: "15–19"
        generate: >-
          1834 Moscow, open field racetrack, spectators in 1830s clothing seen from behind,
          trotter horses pulling light carriages, overcast sky, cinematic, 35mm film grain,
          historically accurate, sepia tone, vertical 9:16
        motion: "Медленная панорама вправо, рысаки бегут рысью, зрители слегка двигаются"
      G2:
        what: "Гроссбух и монеты"
        timecode: "19–21"
        use: "/349a082bb7611f1853112b3f6efdfff.mp4"   # своё оживлённое видео Натальи
        generate: >-
          19th century ledger book and a pile of Russian imperial gold and silver coins on a wooden
          desk, candle light, cinematic, sepia, vertical 9:16
        motion: "Монеты падают на раскрытую книгу, пламя свечи колышется"
      G3:
        what: "Биплан Уточкина над трибунами, 1910"
        timecode: "40–43"
        generate: >-
          May 1910, early Farman biplane flying low over a Moscow hippodrome grandstand,
          crowd in period clothing seen from behind looking up, sepia, cinematic, vertical 9:16
        motion: "Биплан пересекает кадр, толпа машет руками"
      G4:
        what: "Пожар трибун, 1949"
        timecode: "43–48"
        use: "/59d7214bb7711f188d42a7693f982c4.mp4"   # своё оживлённое видео Натальи
        generate: >-
          Night fire at an old hippodrome grandstand with small towers, 1949 Moscow,
          silhouettes of firefighters from behind, sparks, cinematic, sepia, vertical 9:16
        motion: "Пламя колышется, искры поднимаются вверх, дым медленно идёт"

      ДОП1:
        what: "Бега и трибуны с башенками (своё видео)"
        timecode: "21–26"
        use: "/999ac2abb7311f1a1c6e21c62c85c43.mp4"
      ДОП2:
        what: "Зрители с биноклем на трибуне (своё видео)"
        timecode: "15–19"
        use: "/a261972bb2811f1a1c6e21c62c85c43.mp4"

