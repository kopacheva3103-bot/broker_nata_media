; Скопируйте в config.ini (он не попадает в git) и заполните.

[telegram]
; Получить на https://my.telegram.org -> API development tools
api_id = 1234567
api_hash = 0123456789abcdef0123456789abcdef
; Ваш номер — рассылка идёт от ВАШЕГО аккаунта
phone = +79990000000

[sms]
; Приложение «SMS Gateway for Android» (sms-gate.app) на вашем телефоне.
; Локальный режим: адрес телефона в Wi-Fi, логин/пароль из приложения.
url = http://192.168.1.50:8080
; Облачный режим: url = https://api.sms-gate.app/3rdparty/v1
username = sms
password = change-me

[limits]
; Пауза между сообщениями, секунды (случайная в диапазоне) — защита от бана
min_delay = 20
max_delay = 60
; Максимум сообщений в один канал за один запуск
per_run = 40
